[tool.poetry]
name = "fastapi-demo"
version = "0.1.0"
description = ""
authors = ["Dasun Sathsara <me@dasunsathsara.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.88.0"
uvicorn = {extras = ["standard"], version = "^0.20.0"}
psycopg2 = "^2.9.5"
